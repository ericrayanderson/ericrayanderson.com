<body class="play play-hoops">
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="shell">
    <header class="site-header">
      <a class="home-link" href="index.html">eric&gt;</a>
    </header>

    <main id="content" class="page" tabindex="-1">
      <header class="page-header">
        <h1>Basketball</h1>
        <p class="lede">Press and hold to set power. Release to shoot.</p>
      </header>
      <p class="support play-note">The aim is fixed, so power is the whole shot. The hoop moves after each make.</p>

      <div class="stage" id="hoop-stage">
        <canvas id="hoop-canvas" aria-label="Basketball court. Press and hold anywhere to set power, release to shoot."></canvas>
      </div>
      <p class="scoreboard">
        <span>Made <strong id="hoop-made">0</strong></span>
        <span>Shots <strong id="hoop-shots">0</strong></span>
        <span>Streak <strong id="hoop-streak">0</strong></span>
        <span>Best streak <strong id="hoop-best">0</strong></span>
      </p>
      <p id="hoop-live" class="visually-hidden" aria-live="polite"></p>
    </main>
